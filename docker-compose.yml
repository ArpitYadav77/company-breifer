# RecruitSage v2 local stack. `make up` builds and starts everything.
# The v1 Node app at the repo root is unaffected.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: recruitsage
      POSTGRES_PASSWORD: recruitsage
      POSTGRES_DB: recruitsage
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitsage"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]  # persist the job queue across restarts
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: ./apps/api
    env_file: ./apps/api/.env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8000:8000"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes: ["./apps/api:/app"]
    healthcheck:
      # python-based (no curl in slim image); api auto-migrates on startup (create_all)
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else sys.exit(1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  worker:
    build: ./apps/api
    env_file: ./apps/api/.env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: arq app.worker.WorkerSettings
    volumes: ["./apps/api:/app"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('redis',6379),3)\""]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    build: ./apps/web
    env_file: ./apps/web/.env
    environment:
      # Server-side code reaches the api by service name; the browser uses NEXT_PUBLIC_API_URL.
      API_URL: http://api:8000
    depends_on:
      api: { condition: service_healthy }
    ports: ["3000:3000"]
    command: npm run dev
    volumes: ["./apps/web:/app", "/app/node_modules"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(()=>process.exit(0)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

volumes:
  pgdata:
  redisdata:
