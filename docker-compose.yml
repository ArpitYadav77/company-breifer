# Local dev stack for RecruitSage v2 (Next.js + FastAPI + Postgres/pgvector + Redis).
# The existing Node app at the repo root is unaffected; this brings up the new stack.
#   docker compose up --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: recruitsage
      POSTGRES_PASSWORD: recruitsage
      POSTGRES_DB: recruitsage
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitsage"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    env_file: ./apps/api/.env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8000:8000"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes: ["./apps/api:/app"]

  worker:
    build: ./apps/api
    env_file: ./apps/api/.env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: arq app.worker.WorkerSettings
    volumes: ["./apps/api:/app"]

  web:
    build: ./apps/web
    env_file: ./apps/web/.env
    depends_on: [api]
    ports: ["3000:3000"]
    command: npm run dev
    volumes: ["./apps/web:/app", "/app/node_modules"]

volumes:
  pgdata:
