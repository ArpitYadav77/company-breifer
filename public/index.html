<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RecruitSage — Company Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* ---- palette (source of truth) ---- */
        --plum-50:#F3EAF3; --plum-100:#DABBD8; --plum-300:#C38AC0; --plum-500:#9C6C9A;
        --plum-700:#734E71; --plum-800:#483047; --plum-900:#221521;
        --wine-50:#F2CFD0; --wine-300:#E69B9F; --wine-500:#DC5F6C; --wine-700:#7B2E37; --wine-900:#1A0507;
        --teal-50:#BCEDF2; --teal-100:#81CAD2; --teal-300:#66A2A8; --teal-500:#4F7F84;
        --teal-700:#375B5E; --teal-800:#1F3638; --teal-900:#091516;
        --olive-50:#D6DD94; --olive-100:#AFB679; --olive-300:#8B905F; --olive-500:#6A6E48;
        --olive-700:#494C30; --olive-900:#0A0B05;
        --n-50:#EDEFF0; --n-100:#C2C9CC; --n-300:#9BA3A8; --n-400:#7B8285; --n-500:#595F61;
        --n-700:#383B3D; --n-800:#232627; --n-900:#191B1C;

        /* ---- semantic ---- */
        --bg:#141617;
        --text:var(--n-50);
        --text-dim:var(--n-300);
        --text-mute:var(--n-400);
        --line:rgba(237,239,240,.09);
        --line-strong:rgba(237,239,240,.16);
        --surface:rgba(237,239,240,.028);
        --surface-2:rgba(237,239,240,.05);
        --glass:rgba(25,27,28,.72);

        --accent:var(--teal-300);
        --accent-bright:var(--teal-100);
        --accent-deep:var(--teal-500);
        --ai:var(--plum-300);
        --ok:var(--olive-100);
        --warn:var(--wine-500);

        --radius:16px; --radius-sm:11px; --radius-xs:8px;
        --ease:cubic-bezier(.22,.61,.36,1);
        --shadow:0 1px 0 rgba(237,239,240,.04) inset, 0 20px 45px -25px rgba(0,0,0,.8);
        --maxw:1180px;
      }

      * { box-sizing:border-box; }
      html,body { background:var(--bg); }
      body {
        margin:0; color:var(--text);
        font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
        font-size:14px; line-height:1.55; letter-spacing:-.005em;
        -webkit-font-smoothing:antialiased;
        min-height:100vh;
        background:
          radial-gradient(900px 520px at 12% -8%, rgba(79,127,132,.16), transparent 60%),
          radial-gradient(760px 520px at 92% 0%, rgba(115,78,113,.14), transparent 62%),
          radial-gradient(700px 700px at 78% 108%, rgba(106,110,72,.08), transparent 60%),
          var(--bg);
        background-attachment:fixed;
      }
      a { color:var(--accent); text-decoration:none; }
      a:hover { color:var(--accent-bright); }
      ::selection { background:rgba(129,202,210,.28); }

      .wrap { max-width:var(--maxw); margin:0 auto; padding:22px 22px 96px; }

      /* ---------- header ---------- */
      header.app {
        display:flex; align-items:center; justify-content:space-between; gap:18px;
        flex-wrap:wrap; padding:6px 2px 20px;
      }
      .brand { display:flex; align-items:center; gap:13px; }
      .brand .mark { width:40px; height:40px; flex:none; }
      .brand h1 { margin:0; font-size:17px; font-weight:600; letter-spacing:-.02em; }
      .brand .tag { margin:0; font-size:12px; color:var(--text-mute); }
      .hbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
      .status-chip {
        display:inline-flex; align-items:center; gap:7px; font-size:12px; color:var(--text-dim);
        background:var(--surface); border:1px solid var(--line); padding:7px 11px; border-radius:999px;
      }
      .dot { width:7px; height:7px; border-radius:50%; background:var(--n-400); box-shadow:0 0 0 0 rgba(0,0,0,0); }
      .dot.on { background:var(--ok); box-shadow:0 0 10px rgba(175,182,121,.6); }
      .dot.warnc { background:var(--warn); }
      .btn {
        font:inherit; font-weight:600; font-size:13px; cursor:pointer; color:var(--n-900);
        background:linear-gradient(180deg,var(--teal-100),var(--teal-300));
        border:none; padding:9px 16px; border-radius:10px; letter-spacing:-.01em;
        transition:transform .18s var(--ease), box-shadow .18s var(--ease), filter .18s var(--ease);
        box-shadow:0 8px 20px -10px rgba(79,127,132,.7);
      }
      .btn:hover { transform:translateY(-1px); filter:brightness(1.06); }
      .btn:active { transform:translateY(0); }
      .btn:disabled { opacity:.55; cursor:not-allowed; transform:none; filter:none; }
      .btn.ghost {
        background:var(--surface-2); color:var(--text); border:1px solid var(--line-strong);
        box-shadow:none; font-weight:500;
      }
      .btn.ghost:hover { border-color:var(--accent-deep); color:var(--accent-bright); }

      /* ---------- overview metrics ---------- */
      .overview { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin:4px 0 26px; }
      .metric {
        position:relative; background:var(--surface); border:1px solid var(--line);
        border-radius:var(--radius); padding:16px 17px; overflow:hidden; box-shadow:var(--shadow);
      }
      .metric::before {
        content:""; position:absolute; inset:0 auto 0 0; width:3px;
        background:var(--accent-deep); opacity:.75;
      }
      .metric.ok::before { background:var(--olive-100); }
      .metric.ai::before { background:var(--plum-300); }
      .metric.warn::before { background:var(--wine-500); }
      .metric .num { font-size:30px; font-weight:700; letter-spacing:-.03em; line-height:1; }
      .metric .lbl { font-size:12px; color:var(--text-dim); margin-top:8px; }
      .metric .sub { font-size:11px; color:var(--text-mute); margin-top:3px; }
      .metric .sub.pos { color:var(--olive-100); }

      /* ---------- toolbar ---------- */
      .toolbar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
      .search {
        flex:1; min-width:220px; display:flex; align-items:center; gap:9px;
        background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:9px 13px;
      }
      .search:focus-within { border-color:var(--accent-deep); }
      .search input { flex:1; background:none; border:none; outline:none; color:var(--text); font:inherit; }
      .search svg { flex:none; opacity:.5; }
      .filters { display:flex; gap:7px; flex-wrap:wrap; }
      .chip {
        font:inherit; font-size:12.5px; cursor:pointer; color:var(--text-dim);
        background:var(--surface); border:1px solid var(--line); padding:8px 13px; border-radius:999px;
        transition:all .16s var(--ease); white-space:nowrap;
      }
      .chip:hover { color:var(--text); border-color:var(--line-strong); }
      .chip[aria-pressed="true"] {
        color:var(--n-900); background:var(--teal-100); border-color:var(--teal-100); font-weight:600;
      }
      .chip .c { opacity:.7; margin-left:4px; }

      /* ---------- grid + cards ---------- */
      .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
      @media (max-width:820px){ .grid, .overview { grid-template-columns:1fr; } .overview{grid-template-columns:repeat(2,1fr);} }
      @media (max-width:520px){ .overview{grid-template-columns:1fr;} }

      .card {
        position:relative; display:grid; grid-template-columns:104px 1fr; gap:16px;
        background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
        padding:18px; cursor:pointer; overflow:hidden; box-shadow:var(--shadow);
        transition:transform .28s var(--ease), border-color .28s var(--ease), background .28s var(--ease);
      }
      .card:hover { transform:translateY(-3px); border-color:var(--line-strong); background:var(--surface-2); }
      .card:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
      .card .glow {
        position:absolute; width:220px; height:220px; right:-70px; top:-90px; border-radius:50%;
        background:radial-gradient(circle, rgba(79,127,132,.22), transparent 70%);
        opacity:0; transition:opacity .35s var(--ease); pointer-events:none;
      }
      .card:hover .glow { opacity:1; }

      .visual { width:104px; height:104px; align-self:start; position:relative; }
      .visual svg { width:100%; height:100%; display:block; }
      .cbody { min-width:0; }
      .cname { font-size:17px; font-weight:600; letter-spacing:-.02em; margin:0 0 6px;
               white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .badge {
        display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:600;
        padding:3px 9px; border-radius:999px; letter-spacing:.02em; text-transform:uppercase;
      }
      .badge .d { width:6px; height:6px; border-radius:50%; }
      .badge.researched { background:rgba(175,182,121,.14); color:var(--olive-50); }
      .badge.researched .d { background:var(--olive-100); }
      .badge.researching { background:rgba(129,202,210,.14); color:var(--teal-100); }
      .badge.researching .d { background:var(--teal-100); animation:pulse 1.4s infinite; }
      .badge.partial { background:rgba(195,138,192,.14); color:var(--plum-100); }
      .badge.partial .d { background:var(--plum-300); }
      .badge.failed { background:rgba(220,95,108,.15); color:var(--wine-300); }
      .badge.failed .d { background:var(--wine-500); }
      .badge.nodata { background:var(--surface-2); color:var(--text-mute); }
      .badge.nodata .d { background:var(--n-400); }

      .cmeta { color:var(--text-dim); font-size:13px; margin:4px 0 0; display:flex; flex-wrap:wrap; gap:4px 10px; }
      .cmeta b { color:var(--text); font-weight:500; }
      .signals { display:flex; gap:8px; margin:13px 0 12px; flex-wrap:wrap; }
      .sig {
        display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--text-dim);
        background:var(--surface-2); border:1px solid var(--line); padding:6px 10px; border-radius:9px;
      }
      .sig .v { color:var(--text); font-weight:600; }
      .sources { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
      .src { font-size:11px; color:var(--text-mute); background:var(--surface-2); border:1px solid var(--line);
             padding:3px 8px; border-radius:7px; }
      .src.on { color:var(--teal-100); border-color:rgba(129,202,210,.3); }
      .explore { display:inline-flex; align-items:center; gap:6px; color:var(--accent-bright);
                 font-size:13px; font-weight:600; }
      .explore .arrow { transition:transform .22s var(--ease); }
      .card:hover .explore .arrow { transform:translateX(4px); }

      /* ---------- drawer ---------- */
      .scrim {
        position:fixed; inset:0; background:rgba(10,11,12,.62); backdrop-filter:blur(3px);
        opacity:0; pointer-events:none; transition:opacity .3s var(--ease); z-index:40;
      }
      .scrim.open { opacity:1; pointer-events:auto; }
      .drawer {
        position:fixed; top:0; right:0; height:100vh; width:min(580px,94vw); z-index:50;
        background:linear-gradient(180deg, rgba(34,21,33,.55), rgba(20,22,23,.96)), var(--bg);
        border-left:1px solid var(--line-strong); box-shadow:-30px 0 60px -30px rgba(0,0,0,.9);
        transform:translateX(102%); transition:transform .42s var(--ease);
        display:flex; flex-direction:column; overflow:hidden;
      }
      .drawer.open { transform:translateX(0); }
      .dhead { padding:20px 22px 14px; border-bottom:1px solid var(--line); display:flex; gap:14px; align-items:flex-start; }
      .dhead .dvis { width:66px; height:66px; flex:none; }
      .dhead h2 { margin:0 0 6px; font-size:20px; letter-spacing:-.02em; }
      .dclose { margin-left:auto; background:var(--surface-2); border:1px solid var(--line); color:var(--text-dim);
                width:34px; height:34px; border-radius:9px; cursor:pointer; font-size:16px; flex:none; }
      .dclose:hover { color:var(--text); border-color:var(--line-strong); }
      .tabs { display:flex; gap:4px; padding:10px 16px 0; overflow-x:auto; border-bottom:1px solid var(--line); }
      .tabs::-webkit-scrollbar{ height:0; }
      .tab { font:inherit; font-size:12.5px; color:var(--text-mute); background:none; border:none; cursor:pointer;
             padding:9px 11px; border-bottom:2px solid transparent; white-space:nowrap; transition:color .16s; }
      .tab:hover { color:var(--text-dim); }
      .tab[aria-selected="true"] { color:var(--accent-bright); border-bottom-color:var(--accent); }
      .dbody { padding:20px 22px 40px; overflow-y:auto; flex:1; }
      .panel { display:none; animation:fade .3s var(--ease); }
      .panel.active { display:block; }
      .kv { display:grid; grid-template-columns:130px 1fr; gap:6px 14px; margin-bottom:16px; }
      .kv dt { color:var(--text-mute); font-size:12.5px; }
      .kv dd { margin:0; font-size:13.5px; }
      .na { color:var(--text-mute); font-style:italic; }
      h4.sec { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-mute);
               margin:22px 0 10px; font-weight:600; }
      .tagrow { display:flex; flex-wrap:wrap; gap:6px; }
      .t2 { font-size:12px; background:var(--surface-2); border:1px solid var(--line); border-radius:7px;
            padding:4px 9px; color:var(--text-dim); }
      .stage { border-left:2px solid var(--teal-700); padding:0 0 14px 14px; margin-left:3px; position:relative; }
      .stage::before { content:""; position:absolute; left:-5px; top:4px; width:8px; height:8px; border-radius:50%;
                       background:var(--teal-300); }
      .stage .st { font-weight:600; font-size:13.5px; }
      .stage .se { color:var(--text-mute); font-size:12px; margin-bottom:4px; }
      ul.clean { margin:6px 0; padding-left:18px; } ul.clean li { margin-bottom:4px; font-size:13px; }
      .insight { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 15px;
                 margin-bottom:11px; }
      .insight .il { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--plum-100);
                     font-weight:600; margin-bottom:5px; }
      .insight .iv { font-size:13.5px; color:var(--text); }
      .conf { display:inline-flex; align-items:center; gap:7px; font-size:12px; padding:4px 10px; border-radius:999px; }
      .conf.high { background:rgba(175,182,121,.14); color:var(--olive-50); }
      .conf.medium { background:rgba(129,202,210,.14); color:var(--teal-100); }
      .conf.low { background:rgba(220,95,108,.14); color:var(--wine-300); }
      .prov { display:inline-block; font-size:10px; font-weight:600; padding:1px 6px; border-radius:6px;
              vertical-align:middle; letter-spacing:.02em; margin-left:6px; }
      .prov.verified { background:rgba(175,182,121,.16); color:var(--olive-50); }
      .prov.unverified { background:var(--surface-2); color:var(--text-mute); }
      .prov.conflicting { background:rgba(220,95,108,.18); color:var(--wine-300); }
      .prov a { color:inherit; text-decoration:underline; opacity:.85; }
      .badge.conflict { background:rgba(220,95,108,.15); color:var(--wine-300); margin-left:6px; }
      .badge.conflict .d { background:var(--wine-500); }
      .aka { font-size:12px; color:var(--text-mute); margin-top:4px; }
      .srclist a { display:block; font-size:12px; color:var(--text-dim); margin:3px 0; word-break:break-all; }
      .srclist a:hover { color:var(--accent-bright); }
      .drawer-actions { padding:14px 22px; border-top:1px solid var(--line); display:flex; gap:10px; }

      /* ---------- empty + skeleton + banner ---------- */
      .banner { border-radius:12px; padding:12px 15px; margin-bottom:16px; font-size:13px; border:1px solid; }
      .banner.warn { background:rgba(220,95,108,.08); border-color:rgba(220,95,108,.28); color:var(--wine-300); }
      .empty { text-align:center; padding:70px 20px; }
      .empty .eobj { width:150px; height:150px; margin:0 auto 22px; }
      .empty h3 { font-size:20px; margin:0 0 8px; letter-spacing:-.02em; }
      .empty p { color:var(--text-dim); max-width:420px; margin:0 auto 22px; }
      .skel { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); height:190px;
              position:relative; overflow:hidden; }
      .skel::after { content:""; position:absolute; inset:0;
        background:linear-gradient(100deg, transparent 20%, rgba(237,239,240,.05) 50%, transparent 80%);
        transform:translateX(-100%); }
      .muted { color:var(--text-mute); }
      footer { text-align:center; color:var(--text-mute); font-size:12px; margin-top:38px; }

      @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.3;} }
      @keyframes fade { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes floaty { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-5px);} }
      @keyframes shimmer { to { transform:translateX(100%); } }
      @media (prefers-reduced-motion: no-preference) {
        .visual .rot { animation:spin 26s linear infinite; transform-origin:50% 50%; }
        .visual .rot.rev { animation-duration:38s; animation-direction:reverse; }
        .visual { animation:floaty 6s ease-in-out infinite; }
        .dvis .rot, .eobj .rot { animation:spin 30s linear infinite; transform-origin:50% 50%; }
        .skel::after { animation:shimmer 1.5s infinite; }
        .spin { animation:spin 1s linear infinite; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="app">
        <div class="brand">
          <span class="mark" id="brandMark"></span>
          <div>
            <h1>RecruitSage</h1>
            <p class="tag">Company Intelligence</p>
          </div>
        </div>
        <div class="hbar" id="hbar">
          <span class="status-chip"><span class="dot" id="dGmail"></span> Gmail</span>
          <span class="status-chip"><span class="dot" id="dTg"></span> Telegram</span>
          <span class="status-chip" id="syncMeta">Last sync —</span>
          <button class="btn" id="syncBtn">Sync Gmail</button>
        </div>
      </header>

      <div id="banners"></div>
      <section class="overview" id="overview" aria-label="Intelligence overview"></section>

      <div class="toolbar" id="toolbar" hidden>
        <label class="search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="search" type="text" placeholder="Search companies, industry, role…" aria-label="Search companies" autocomplete="off" />
        </label>
        <div class="filters" id="filters" role="group" aria-label="Filter companies"></div>
      </div>

      <main id="main" aria-live="polite"></main>
      <footer>Intelligence researched from public sources · unverifiable data is labelled, never fabricated · Not affiliated with LinkedIn, Glassdoor or RecruitSage.</footer>
    </div>

    <div class="scrim" id="scrim"></div>
    <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Company intelligence" tabindex="-1"></aside>

    <script>
    (function(){
      "use strict";
      const $ = (s,el=document)=>el.querySelector(s);
      const esc = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
      const NA = '<span class="na">Not available from current sources</span>';
      const fmt = d => d ? new Date(d).toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"}) : "—";
      const has = v => v!=null && v!=="" && String(v).toLowerCase()!=="data unavailable" && String(v).toLowerCase()!=="insufficient data";
      const plural = (n,w) => `${n} ${w}${n===1?"":"s"}`;
      const factOf = (r,field) => (r.facts||[]).find(f=>f.field===field) || null;
      function prov(r,field){
        const f=factOf(r,field); if(!f||!f.status) return "";
        const pct=(typeof f.confidence==="number")?` ${Math.round(f.confidence*100)}%`:"";
        const src=f.source?` <a href="${esc(f.source)}" target="_blank" rel="noopener">src</a>`:"";
        return `<span class="prov ${f.status}">${esc(f.status)}${pct}${src}</span>`;
      }

      const state = { companies:[], stats:null, status:null, filter:"all", query:"", selected:null };

      /* ---------- palette accents by industry ---------- */
      const ACCENTS = {
        teal:{a:"#81CAD2",b:"#4F7F84",c:"#375B5E"},
        plum:{a:"#C38AC0",b:"#9C6C9A",c:"#734E71"},
        olive:{a:"#D6DD94",b:"#AFB679",c:"#6A6E48"},
        wine:{a:"#E69B9F",b:"#DC5F6C",c:"#7B2E37"},
        neutral:{a:"#C2C9CC",b:"#9BA3A8",c:"#595F61"},
      };
      function industryProfile(industry){
        const s=(industry||"").toLowerCase();
        const m=(re)=>re.test(s);
        if(m(/health|medical|pharma|clinic|bio|hospital/)) return {key:"health",accent:"teal",shape:"sphere"};
        if(m(/\bai\b|a\.i|machine|ml|artificial|data|analyt|intellig/)) return {key:"ai",accent:"plum",shape:"neural"};
        if(m(/fin|bank|pay|invest|capital|insur|wealth/)) return {key:"fintech",accent:"olive",shape:"bars"};
        if(m(/saas|software|cloud|it |information tech|platform|internet|tech/)) return {key:"saas",accent:"teal",shape:"cube"};
        if(m(/auto|vehicle|motor|truck|manufact|engineer|industrial|energy/)) return {key:"auto",accent:"olive",shape:"gear"};
        if(m(/consult|advisor|services|strategy/)) return {key:"consult",accent:"plum",shape:"grid"};
        if(m(/cyber|security|defen|privacy/)) return {key:"cyber",accent:"teal",shape:"shield"};
        if(m(/educat|learn|edtech|academ|school|university/)) return {key:"edu",accent:"olive",shape:"grid"};
        return {key:"default",accent:"teal",shape:"orbit"};
      }
      // Industry-adaptive abstract "intelligence object" — lightweight animated SVG (no 3D lib).
      function visual(industry, size){
        const p=industryProfile(industry), c=ACCENTS[p.accent];
        const cx=50, cy=50;
        let core="";
        if(p.shape==="cube") core=`<rect x="38" y="38" width="24" height="24" rx="3" fill="none" stroke="${c.a}" stroke-width="1.6"/><rect x="43" y="33" width="24" height="24" rx="3" fill="none" stroke="${c.b}" stroke-width="1.2" opacity=".6"/>`;
        else if(p.shape==="bars") core=`<g stroke="${c.a}" stroke-width="3" stroke-linecap="round"><line x1="42" y1="58" x2="42" y2="48"/><line x1="50" y1="58" x2="50" y2="40"/><line x1="58" y1="58" x2="58" y2="45"/></g>`;
        else if(p.shape==="gear") core=`<circle cx="50" cy="50" r="9" fill="none" stroke="${c.a}" stroke-width="1.8"/><g stroke="${c.b}" stroke-width="2">${Array.from({length:8}).map((_,i)=>{const an=i*45*Math.PI/180;return `<line x1="${50+Math.cos(an)*11}" y1="${50+Math.sin(an)*11}" x2="${50+Math.cos(an)*15}" y2="${50+Math.sin(an)*15}"/>`;}).join("")}</g>`;
        else if(p.shape==="shield") core=`<path d="M50 36 L62 41 V51 C62 59 56 63 50 65 C44 63 38 59 38 51 V41 Z" fill="none" stroke="${c.a}" stroke-width="1.6"/>`;
        else if(p.shape==="neural") core=`<g fill="${c.a}">${[[50,40],[38,52],[62,52],[44,62],[56,62]].map(pt=>`<circle cx="${pt[0]}" cy="${pt[1]}" r="2.4"/>`).join("")}</g><g stroke="${c.b}" stroke-width="1" opacity=".7"><line x1="50" y1="40" x2="38" y2="52"/><line x1="50" y1="40" x2="62" y2="52"/><line x1="38" y1="52" x2="44" y2="62"/><line x1="62" y1="52" x2="56" y2="62"/><line x1="44" y1="62" x2="56" y2="62"/></g>`;
        else if(p.shape==="grid") core=`<g stroke="${c.a}" stroke-width="1.2" opacity=".85">${[40,50,60].map(x=>`<line x1="${x}" y1="38" x2="${x}" y2="62"/>`).join("")}${[38,50,62].map(y=>`<line x1="40" y1="${y}" x2="60" y2="${y}"/>`).join("")}</g>`;
        else core=`<circle cx="50" cy="50" r="10" fill="none" stroke="${c.a}" stroke-width="1.8"/><circle cx="50" cy="50" r="4" fill="${c.a}"/>`;
        const orbit = (r,dur,rev,col,dots)=>`<g class="rot${rev?' rev':''}"><circle cx="50" cy="50" r="${r}" fill="none" stroke="${col}" stroke-width="1" opacity=".28"/>${dots.map(a=>`<circle cx="${50+Math.cos(a*Math.PI/180)*r}" cy="${50+Math.sin(a*Math.PI/180)*r}" r="1.8" fill="${col}"/>`).join("")}</g>`;
        return `<svg viewBox="0 0 100 100" role="img" aria-label="${esc(p.key)} intelligence visual">
          <defs><radialGradient id="g${p.key}" cx="50%" cy="45%" r="60%"><stop offset="0%" stop-color="${c.a}" stop-opacity=".22"/><stop offset="100%" stop-color="${c.a}" stop-opacity="0"/></radialGradient></defs>
          <circle cx="50" cy="50" r="46" fill="url(#g${p.key})"/>
          ${orbit(42,26,false,c.c,[15,140,255])}
          ${orbit(33,38,true,c.b,[70,200,320])}
          ${core}
        </svg>`;
      }

      /* ---------- derive status ---------- */
      function statusOf(c){
        if(c.researchStatus==="failed") return {key:"failed",label:"Failed",cls:"failed"};
        if(!c.research || c.researchStatus==="pending") return {key:"new",label:"Researching",cls:"researching"};
        const sec=c.research.sections||{};
        const vals=Object.values(sec);
        const bad=vals.filter(v=>v==="unavailable"||v==="partial").length;
        if(vals.length && bad>=Math.ceil(vals.length/2)) return {key:"partial",label:"Partial",cls:"partial"};
        return {key:"researched",label:"Researched",cls:"researched"};
      }

      /* ---------- source chips (only what exists) ---------- */
      function sourceChips(c){
        const r=c.research||{}, out=[];
        const li=r.linkedin||{}, gd=r.glassdoor||{}, b=r.basic||{};
        out.push(`<span class="src on">LinkedIn</span>`); // link always built
        if(has(b.website)) out.push(`<span class="src on">Website</span>`);
        if(gd.rating!=null || has(gd.summary)) out.push(`<span class="src on">Glassdoor</span>`);
        if((r.sourceUrls||[]).length) out.push(`<span class="src on">${r.sourceUrls.length} sources</span>`);
        if(out.length<=1 && !(r.sourceUrls||[]).length) out.push(`<span class="src">Limited sources</span>`);
        return out.join("");
      }

      /* ---------- card ---------- */
      function card(c){
        const r=c.research||{}, b=r.basic||{}, st=statusOf(c);
        const role=(c.lastRoles&&c.lastRoles[0])||"";
        const hire=r.hiringProcess?.steps?.length||0;
        const iv=(r.interviewQuestions?.dsa?.length||0)+(r.interviewQuestions?.csFundamentals?.length||0);
        return `<article class="card" tabindex="0" role="button" aria-label="Open ${esc(c.companyName)} intelligence" data-id="${esc(c._id)}">
          <span class="glow"></span>
          <div class="visual">${visual(b.industry)}</div>
          <div class="cbody">
            <h3 class="cname">${esc(c.companyName)}</h3>
            <span class="badge ${st.cls}"><span class="d"></span>${st.label}</span>
            ${r.hasConflict?`<span class="badge conflict"><span class="d"></span>Conflict</span>`:""}
            <p class="cmeta">
              ${has(b.industry)?`<span><b>${esc(b.industry)}</b></span>`:`<span class="muted">Industry pending</span>`}
              ${c.lastRoleLocation?`<span>📍 ${esc(c.lastRoleLocation)}</span>`:""}
              ${role?`<span>${esc(role)}</span>`:""}
            </p>
            <div class="signals">
              <span class="sig"${hire?"":' title="Hiring process not available from current sources"'}>Hiring <span class="v">${hire?plural(hire,"stage"):"—"}</span></span>
              <span class="sig"${iv?"":' title="Interview topics not available from current sources"'}>Interview <span class="v">${iv?plural(iv,"topic"):"—"}</span></span>
              ${r.glassdoor?.rating!=null?`<span class="sig">Glassdoor <span class="v">★ ${esc(r.glassdoor.rating)}</span></span>`:""}
            </div>
            <div class="sources">${sourceChips(c)}</div>
            <span class="explore">Explore Intelligence <span class="arrow">→</span></span>
          </div>
        </article>`;
      }

      /* ---------- metrics ---------- */
      function overview(){
        const s=state.stats||{}; const m=(num,lbl,sub,cls)=>`
          <div class="metric ${cls||''}"><div class="num" data-to="${num}">0</div>
          <div class="lbl">${lbl}</div>${sub?`<div class="sub ${cls==='ok'?'pos':''}">${sub}</div>`:""}</div>`;
        const attention=(s.failed||0)+(s.needsReview||0);
        $("#overview").innerHTML =
          m(s.total||0,"Companies Detected", s.newThisSync?`+${s.newThisSync} this sync`:"", "")+
          m(s.researched||0,"Research Completed","","ok")+
          m(s.pending||0,"Research Pending","","ai")+
          m(attention,"Needs Attention","", attention?"warn":"");
        document.querySelectorAll(".num").forEach(el=>countUp(el, +el.dataset.to));
      }
      function countUp(el,to){
        if(to<=0){el.textContent="0";return;}
        const red=matchMedia("(prefers-reduced-motion: reduce)").matches;
        if(red){el.textContent=to;return;}
        const start=performance.now(), dur=700;
        function step(t){const p=Math.min(1,(t-start)/dur);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step);}
        requestAnimationFrame(step);
      }

      /* ---------- filters ---------- */
      const FILTERS=[["all","All"],["new","Researching"],["researched","Researched"],["partial","Partial"],["attention","Needs Attention"]];
      function renderFilters(){
        const counts={all:state.companies.length,new:0,researched:0,partial:0,attention:0};
        state.companies.forEach(c=>{const k=statusOf(c).key;if(k==="new")counts.new++;else if(k==="researched")counts.researched++;else if(k==="partial")counts.partial++;if(k==="failed"||k==="partial")counts.attention++;});
        $("#filters").innerHTML=FILTERS.map(([k,l])=>`<button class="chip" data-f="${k}" aria-pressed="${state.filter===k}">${l}<span class="c">${counts[k]||0}</span></button>`).join("");
      }
      function visible(){
        const q=state.query.trim().toLowerCase();
        return state.companies.filter(c=>{
          const st=statusOf(c).key;
          if(state.filter==="attention"){ if(!(st==="failed"||st==="partial")) return false; }
          else if(state.filter!=="all" && st!==state.filter) return false;
          if(q){ const hay=(c.companyName+" "+(c.research?.basic?.industry||"")+" "+(c.lastRoles||[]).join(" ")).toLowerCase(); if(!hay.includes(q)) return false; }
          return true;
        });
      }
      function renderGrid(){
        const list=visible();
        if(!state.companies.length){ $("#main").innerHTML=emptyState(); $("#brandMark").innerHTML=visual("default"); wireEmpty(); return; }
        $("#main").innerHTML = list.length
          ? `<div class="grid">${list.map(card).join("")}</div>`
          : `<p class="muted" style="padding:40px 4px;text-align:center">No companies match this view.</p>`;
        document.querySelectorAll(".card").forEach(el=>{
          el.addEventListener("click",()=>openDrawer(el.dataset.id));
          el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openDrawer(el.dataset.id);}});
        });
      }

      /* ---------- drawer ---------- */
      const TABS=[["overview","Overview"],["salary","Salary"],["career","Career"],["hiring","Hiring"],["interview","Interview"],["glassdoor","Glassdoor"],["sources","Sources"],["ai","AI Insights"]];
      function openDrawer(id){
        const c=state.companies.find(x=>String(x._id)===String(id)); if(!c)return;
        state.selected=c;
        const r=c.research||{}, b=r.basic||{};
        $("#drawer").innerHTML=`
          <div class="dhead">
            <div class="dvis">${visual(b.industry)}</div>
            <div><h2>${esc(c.companyName)}</h2>${drawerBadge(c)}${r.hasConflict?`<span class="badge conflict"><span class="d"></span>Conflict</span>`:""}
              <div class="cmeta" style="margin-top:6px">${has(b.industry)?esc(b.industry):'<span class="muted">Industry pending</span>'}${has(b.headquarters)?` · ${esc(b.headquarters)}`:""}</div>
              ${(c.aliases&&c.aliases.length)?`<div class="aka">Also seen as: ${c.aliases.map(esc).join(", ")}</div>`:""}</div>
            <button class="dclose" id="dclose" aria-label="Close">✕</button>
          </div>
          <div class="tabs" role="tablist">${TABS.map(([k,l],i)=>`<button class="tab" role="tab" data-t="${k}" aria-selected="${i===0}">${l}</button>`).join("")}</div>
          <div class="dbody" id="dbody">${TABS.map(([k],i)=>`<div class="panel ${i===0?'active':''}" data-p="${k}">${panel(k,c)}</div>`).join("")}</div>
          <div class="drawer-actions">
            <button class="btn ghost" id="refreshBtn" data-id="${esc(c._id)}">Refresh Research</button>
            ${has(b.website)?`<a class="btn ghost" href="${esc(b.website)}" target="_blank" rel="noopener">Website</a>`:""}
          </div>`;
        $("#drawer").querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>selectTab(t.dataset.t)));
        $("#dclose").addEventListener("click",closeDrawer);
        $("#refreshBtn").addEventListener("click",refreshResearch);
        $("#scrim").classList.add("open"); $("#drawer").classList.add("open");
        $("#drawer").focus();
      }
      function drawerBadge(c){const st=statusOf(c);return `<span class="badge ${st.cls}"><span class="d"></span>${st.label}</span>`;}
      function selectTab(k){
        $("#drawer").querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected", t.dataset.t===k));
        $("#drawer").querySelectorAll(".panel").forEach(p=>p.classList.toggle("active", p.dataset.p===k));
      }
      function closeDrawer(){ $("#scrim").classList.remove("open"); $("#drawer").classList.remove("open"); state.selected=null; }

      function list(arr){ return Array.isArray(arr)&&arr.length?`<ul class="clean">${arr.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`:NA; }
      function tags(arr){ return Array.isArray(arr)&&arr.length?`<div class="tagrow">${arr.map(i=>`<span class="t2">${esc(i)}</span>`).join("")}</div>`:NA; }

      function panel(k,c){
        const r=c.research||{}, b=r.basic||{}, li=r.linkedin||{}, gd=r.glassdoor||{}, sd=r.salaryData||{};
        if(k==="overview"){
          const role=(c.lastRoles||[]).join(", ");
          return `<dl class="kv">
            <dt>Industry</dt><dd>${has(b.industry)?esc(b.industry):NA}${prov(r,"industry")}</dd>
            <dt>Company HQ</dt><dd>${has(b.headquarters)?esc(b.headquarters):NA}${has(b.headquartersNote)?` <span class="muted">(${esc(b.headquartersNote)})</span>`:""}${prov(r,"headquarters")}</dd>
            <dt>Role location</dt><dd>${c.lastRoleLocation?esc(c.lastRoleLocation):'<span class="na">Not specified in the email</span>'}</dd>
            <dt>Founded</dt><dd>${has(b.foundedYear)?esc(b.foundedYear):NA}${prov(r,"foundedYear")}</dd>
            <dt>Website</dt><dd>${has(b.website)?`<a href="${esc(b.website)}" target="_blank" rel="noopener">${esc(b.website)}</a>`:'<span class="na">Not available from current sources</span>'}${prov(r,"website")}</dd>
            <dt>Role(s)</dt><dd>${role?esc(role):NA}</dd>
            ${(c.aliases&&c.aliases.length)?`<dt>Also known as</dt><dd>${c.aliases.map(esc).join(", ")}</dd>`:""}
            <dt>Detected</dt><dd>${fmt(c.lastDetectedAt)}</dd>
            <dt>Emails</dt><dd>${plural((c.gmailMessageIds||[]).length,"RecruitSage message")}</dd>
            <dt>Research updated</dt><dd>${fmt(c.researchUpdatedAt)}</dd>
          </dl>`;
        }
        if(k==="salary"){
          const e=sd.entryLevel;
          if(!e || e.confidence==="unavailable") return NA;
          const row=(x)=>`<div class="insight"><div class="il" style="color:var(--olive-50)">${esc(x.role||"Role")}</div>
            <div class="iv">${has(x.range)?esc(x.range):NA}
            ${x.totalOrCtc?`<div class="muted">CTC/Total: ${esc(x.totalOrCtc)}</div>`:""}
            ${x.base?`<div class="muted">Base: ${esc(x.base)}${x.bonus?` · Bonus: ${esc(x.bonus)}`:""}</div>`:""}
            <div class="muted">${esc(x.source||"source n/a")}${x.year?` · ${esc(x.year)}`:""}${x.location?` · ${esc(x.location)}`:""} · confidence: ${esc(x.confidence||"low")}</div></div></div>`;
          return row({...e,role:e.role||"Entry level / fresher"})+(sd.otherRoles||[]).map(row).join("")+(sd.note?`<p class="muted">${esc(sd.note)}</p>`:"");
        }
        if(k==="career"){
          if(!Array.isArray(r.careerGrowth)||!r.careerGrowth.length) return NA;
          return `<p class="muted" style="margin-top:0">Typical path based on public information — not a guaranteed progression.</p>`+
            r.careerGrowth.map(s=>`<div class="stage"><div class="st">${esc(s.stage||"")} · ${has(s.title)?esc(s.title):"—"}</div>
            <div class="se">${esc(s.experience||"")}${s.salaryRange?` · ${esc(s.salaryRange)}`:""}</div>
            ${s.responsibilities?.length?list(s.responsibilities):""}${s.skills?.length?tags(s.skills):""}</div>`).join("");
        }
        if(k==="hiring"){
          if(!r.hiringProcess?.steps?.length) return NA;
          return list(r.hiringProcess.steps)+
            (r.hiringProcess.variesBy?.length?`<h4 class="sec">Varies by</h4>${tags(r.hiringProcess.variesBy)}`:"")+
            (r.hiringProcess.note?`<p class="muted">${esc(r.hiringProcess.note)}</p>`:"");
        }
        if(k==="interview"){
          const q=r.interviewQuestions||{};
          const any=(q.dsa||[]).length+(q.csFundamentals||[]).length+(q.sql||[]).length+(q.projects||[]).length+(q.behavioral||[]).length;
          if(!any) return NA;
          return `<p class="muted" style="margin-top:0">Commonly reported topics — not guaranteed.</p>
            <h4 class="sec">DSA / Coding</h4>${tags(q.dsa)}
            <h4 class="sec">CS Fundamentals</h4>${tags(q.csFundamentals)}
            <h4 class="sec">SQL</h4>${tags(q.sql)}
            <h4 class="sec">Projects</h4>${list(q.projects)}
            <h4 class="sec">Behavioral</h4>${list(q.behavioral)}`;
        }
        if(k==="glassdoor"){
          if(gd.rating==null && !has(gd.summary)) return `${NA} ${gd.url?`<div style="margin-top:10px"><a href="${esc(gd.url)}" target="_blank" rel="noopener">Open Glassdoor →</a></div>`:""}`;
          return `<dl class="kv"><dt>Rating</dt><dd>${gd.rating!=null?`★ ${esc(gd.rating)} / 5`:NA}</dd>
            <dt>Reviews</dt><dd>${gd.reviewCount!=null?esc(gd.reviewCount):NA}</dd></dl>
            <p>${has(gd.summary)?esc(gd.summary):NA}</p>
            ${gd.positives?.length?`<h4 class="sec">Positives</h4>${tags(gd.positives)}`:""}
            ${gd.negatives?.length?`<h4 class="sec">Negatives</h4>${tags(gd.negatives)}`:""}
            ${gd.url?`<p style="margin-top:12px"><a href="${esc(gd.url)}" target="_blank" rel="noopener">Open Glassdoor →</a></p>`:""}`;
        }
        if(k==="sources"){
          const links=[];
          if(li.companyUrl)links.push(["LinkedIn company",li.companyUrl]);
          if(li.alumniSearchUrl)links.push(["Thapar/TIET alumni search",li.alumniSearchUrl]);
          if(gd.url)links.push(["Glassdoor",gd.url]);
          if(has(b.website))links.push(["Website",b.website]);
          return `<div class="tagrow" style="margin-bottom:14px">${links.map(([l,u])=>`<a class="t2" href="${esc(u)}" target="_blank" rel="noopener">${esc(l)} →</a>`).join("")}</div>
            <h4 class="sec">Research source URLs</h4>
            ${(r.sourceUrls||[]).length?`<div class="srclist">${r.sourceUrls.slice(0,30).map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("")}</div>`:'<span class="muted">No source URLs captured.</span>'}`;
        }
        if(k==="ai"){
          return aiInsights(c);
        }
        return NA;
      }

      /* ---------- AI insights (honest, derived from present data only) ---------- */
      function aiInsights(c){
        const r=c.research||{}, sec=r.sections||{};
        const items=[];
        const roles=(c.lastRoles||[]);
        items.push(["Role Signals", roles.length?`Roles seen across ${(c.gmailMessageIds||[]).length} RecruitSage email(s): ${esc(roles.join(", "))}.`:"No specific role stated in the RecruitSage emails."]);
        const hire=r.hiringProcess?.steps?.length;
        items.push(["Hiring Signals", hire?`A ${hire}-stage hiring process is commonly reported for similar roles.`:"Hiring process not available from current sources."]);
        const cg=r.careerGrowth?.length;
        items.push(["Career Signals", cg?`A ${cg}-stage typical progression was mapped from public information.`:"Career progression not available from current sources."]);
        const iv=(r.interviewQuestions?.dsa?.length||0)+(r.interviewQuestions?.csFundamentals?.length||0)+(r.interviewQuestions?.sql?.length||0);
        items.push(["Interview Signals", iv?`${plural(iv,"commonly reported interview topic")} identified across DSA, CS fundamentals and SQL.`:"Interview topics not available from current sources."]);
        // confidence derived from how many sections carry real data
        const vals=Object.values(sec); const ok=vals.filter(v=>v==="ok").length;
        const ratio=vals.length?ok/vals.length:0;
        const conf=ratio>=.7?["high","High"]:ratio>=.4?["medium","Medium"]:["low","Low"];
        const intro=`<div class="insight"><div class="il">◆ AI Intelligence</div><div class="iv muted">Signals below are derived only from the public research already gathered for ${esc(c.companyName)}. Nothing is inferred beyond the available sources.</div></div>`;
        return intro + items.map(([l,v])=>`<div class="insight"><div class="il">${esc(l)}</div><div class="iv">${v}</div></div>`).join("")+
          `<h4 class="sec">Research Confidence</h4><span class="conf ${conf[0]}">● ${conf[1]} — ${ok}/${vals.length||0} sections with data</span>`;
      }

      async function refreshResearch(e){
        const btn=e.currentTarget, id=btn.dataset.id;
        btn.disabled=true; btn.textContent="Researching…";
        try{
          const res=await fetch(`/api/companies/${id}/refresh`,{method:"POST"}).then(r=>r.json());
          await loadData(false);
          const fresh=state.companies.find(x=>String(x._id)===String(id));
          if(fresh){ openDrawer(id); } // re-render drawer with new data
        }catch(err){ btn.disabled=false; btn.textContent="Refresh Research"; }
      }

      /* ---------- empty ---------- */
      function emptyState(){
        return `<div class="empty"><div class="eobj">${visual("default")}</div>
          <h3>No companies detected yet</h3>
          <p>Sync Gmail to let RecruitSage discover recruitment opportunities from your inbox and build intelligence briefs.</p>
          <button class="btn" id="emptySync">Sync Gmail</button></div>`;
      }
      function wireEmpty(){ const b=$("#emptySync"); if(b) b.addEventListener("click",doSync); }

      /* ---------- header status ---------- */
      function renderStatus(s){
        state.status=s;
        $("#dGmail").className="dot"+(s.gmailAuthOk?" on":s.gmailConfigured?" warnc":"");
        const tg=s.telegram||{};
        $("#dTg").className="dot"+(tg.connected?" on":tg.configured?" warnc":"");
        $("#syncMeta").textContent=`Last sync ${fmt(s.lastSyncAt)}`+(s.pollIntervalMinutes>0?` · auto ${s.pollIntervalMinutes}m`:"");
        const banners=[];
        if(!s.gmailConfigured) banners.push(`<div class="banner warn">Gmail not connected. Add OAuth credentials and run <code>node scripts/gmail-auth.js</code>, then Sync.</div>`);
        else if(!s.gmailAuthOk) banners.push(`<div class="banner warn">Gmail authentication failed — the token may be expired. Re-run <code>node scripts/gmail-auth.js</code>.</div>`);
        $("#banners").innerHTML=banners.join("");
      }

      /* ---------- data ---------- */
      async function loadData(withStatus=true){
        const reqs=[fetch("/api/companies").then(r=>r.json())];
        if(withStatus) reqs.push(fetch("/api/status").then(r=>r.json()));
        const [data,status]=await Promise.all(reqs);
        state.companies=data.companies||[]; state.stats=data.stats||null;
        if(status) renderStatus(status);
        overview(); $("#toolbar").hidden=!state.companies.length; renderFilters(); renderGrid();
      }
      async function boot(){
        $("#brandMark").innerHTML=visual("ai");
        $("#main").innerHTML=`<div class="grid">${Array.from({length:4}).map(()=>`<div class="skel"></div>`).join("")}</div>`;
        try{ await loadData(true); }
        catch(err){ $("#main").innerHTML=`<div class="banner warn">Failed to load dashboard: ${esc(err.message)}</div>`; }
      }

      async function doSync(){
        const btn=$("#syncBtn"); btn.disabled=true; const orig=btn.textContent; btn.textContent="Syncing…";
        try{
          const r=await fetch("/api/sync",{method:"POST"}).then(r=>r.json());
          await loadData(true);
          if(!r.ok) $("#banners").insertAdjacentHTML("beforeend",`<div class="banner warn">Sync: ${esc(r.reason||"failed")}</div>`);
        }catch(err){ $("#banners").innerHTML=`<div class="banner warn">Sync error: ${esc(err.message)}</div>`; }
        finally{ btn.disabled=false; btn.textContent=orig; }
      }

      /* ---------- events ---------- */
      $("#syncBtn").addEventListener("click",doSync);
      $("#scrim").addEventListener("click",closeDrawer);
      document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDrawer(); });
      $("#filters").addEventListener("click",e=>{ const b=e.target.closest(".chip"); if(!b)return; state.filter=b.dataset.f; renderFilters(); renderGrid(); });
      let t; $("#search").addEventListener("input",e=>{ clearTimeout(t); t=setTimeout(()=>{ state.query=e.target.value; renderGrid(); },160); });

      boot();
    })();
    </script>
  </body>
</html>
