[project]
name = "recruitsage-api"
version = "0.1.0"
description = "RecruitSage v2 backend: Gmail ingestion, LangGraph research agent, RAG chat, provenance-tracked company intelligence."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlmodel>=0.0.22",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "pgvector>=0.3",
  "alembic>=1.13",
  "redis>=5.0",
  "arq>=0.26",
  "httpx>=0.27",
  "tenacity>=9.0",
  "litellm>=1.44",
  "langgraph>=0.2",
  "google-api-python-client>=2.140",
  "google-auth-oauthlib>=1.2",
  "cryptography>=43.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
